<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}</style><title>Code, hosting and private data are separate</title><rect x="0" y="0" width="1200" height="450" rx="0" fill="#f3f6ee"/><text x="48" y="60" font-size="34" fill="#214e43" font-weight="700">Three accounts. Clear ownership.</text><text x="48" y="99" font-size="20" fill="#637a6a" font-weight="400">Copying the code does not copy wallet records or developer credentials.</text><rect x="48" y="142" width="345" height="230" rx="22" fill="#fff"/><text x="73" y="188" font-size="28" fill="#214e43" font-weight="700">GitHub</text><text x="73" y="231" font-size="20" fill="#214e43" font-weight="700">Your source code</text><text x="73" y="282" font-size="17" fill="#637a6a" font-weight="400">Fork, download or transfer</text><text x="73" y="326" font-size="16" fill="#637a6a" font-weight="400">Public under the MIT license</text><text x="401" y="262" font-size="26" fill="#214e43" font-weight="400">→</text><rect x="428" y="142" width="345" height="230" rx="22" fill="#fff"/><text x="453" y="188" font-size="28" fill="#214e43" font-weight="700">Cloudflare</text><text x="453" y="231" font-size="20" fill="#214e43" font-weight="700">Your app address</text><text x="453" y="282" font-size="17" fill="#637a6a" font-weight="400">Build and serve the frontend</text><text x="453" y="326" font-size="16" fill="#637a6a" font-weight="400">Public app · private sign-in</text><text x="781" y="262" font-size="26" fill="#214e43" font-weight="400">→</text><rect x="808" y="142" width="345" height="230" rx="22" fill="#214e43"/><text x="833" y="188" font-size="28" fill="#fff" font-weight="700">Supabase</text><text x="833" y="231" font-size="20" fill="#d8edbc" font-weight="700">Your private records</text><text x="833" y="282" font-size="17" fill="#e8efe4" font-weight="400">Auth + database + receipts</text><text x="833" y="326" font-size="16" fill="#e8efe4" font-weight="400">Owner-scoped access policies</text><text x="48" y="414" font-size="18" fill="#637a6a" font-weight="400">Private data is protected by backend rules—not by hiding the source code.</text></svg>