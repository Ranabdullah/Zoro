<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}</style><title>Install Zoro in your own accounts</title><rect x="0" y="0" width="1200" height="610" rx="0" fill="#143d33"/><text x="48" y="64" font-size="34" fill="#fff" font-weight="700">Your Zoro, from source to sign-in</text><text x="48" y="104" font-size="20" fill="#c3d6c5" font-weight="400">Follow the full setup guide. Use a new empty database.</text><rect x="48" y="148" width="254" height="215" rx="22" fill="#fff"/><text x="69" y="190" font-size="32" fill="#9cb68b" font-weight="700">01</text><text x="69" y="225" font-size="17" fill="#214e43" font-weight="700">COPY</text><text x="69" y="274" font-size="17" fill="#214e43" font-weight="700">Fork GitHub source</text><text x="69" y="313" font-size="15" fill="#637a6a" font-weight="400">Keep the zoro folder</text><rect x="333" y="148" width="254" height="215" rx="22" fill="#fff"/><text x="354" y="190" font-size="32" fill="#9cb68b" font-weight="700">02</text><text x="354" y="225" font-size="17" fill="#214e43" font-weight="700">CONFIGURE</text><text x="354" y="274" font-size="17" fill="#214e43" font-weight="700">Run Supabase setup</text><text x="354" y="313" font-size="15" fill="#637a6a" font-weight="400">Enable email + TOTP</text><rect x="618" y="148" width="254" height="215" rx="22" fill="#fff"/><text x="639" y="190" font-size="32" fill="#9cb68b" font-weight="700">03</text><text x="639" y="225" font-size="17" fill="#214e43" font-weight="700">DEPLOY</text><text x="639" y="274" font-size="17" fill="#214e43" font-weight="700">Connect Cloudflare</text><text x="639" y="313" font-size="15" fill="#637a6a" font-weight="400">Build from your GitHub</text><rect x="903" y="148" width="254" height="215" rx="22" fill="#fff"/><text x="924" y="190" font-size="32" fill="#9cb68b" font-weight="700">04</text><text x="924" y="225" font-size="17" fill="#214e43" font-weight="700">VERIFY</text><text x="924" y="274" font-size="17" fill="#214e43" font-weight="700">Confirm and sign in</text><text x="924" y="313" font-size="15" fill="#637a6a" font-weight="400">Start with an empty wallet</text><rect x="48" y="400" width="1104" height="158" rx="22" fill="#244f43"/><text x="76" y="440" font-size="17" fill="#d8edbc" font-weight="700">CLOUDFLARE BUILD VALUES</text><text x="76" y="483" font-size="22" fill="#fff" font-weight="400">Root: zoro    •    Build: npm ci &amp;&amp; npm run build    •    Output: dist</text><text x="76" y="523" font-size="20" fill="#d0dfd1" font-weight="400">SUPABASE_URL + SUPABASE_PUBLISHABLE_KEY · public values only</text></svg>