 font-size="13" fill="#d8edbc" font-weight="400">Euro (€) · EUR</text><text x="855" y="369" font-size="29" fill="#fff" font-weight="700">€1,250.00</text><rect x="1110" y="249" width="190" height="66" rx="12" fill="#f1f5ec"/><text x="1127" y="275" font-size="11" fill="#6b8074" font-weight="700">INCOME</text><text x="1127" y="301" font-size="19" fill="#214e43" font-weight="700">Job / salary</text><rect x="1110" y="327" width="190" height="85" rx="12" fill="#f1f5ec"/><text x="1127" y="354" font-size="11" fill="#6b8074" font-weight="700">REPORTS</text><text x="1127" y="384" font-size="21" fill="#214e43" font-weight="700">Excel + PDF</text><path d="M755 526h625l-45 28H795z" fill="#a5bbab"/><rect x="1155" y="388" width="176" height="280" rx="26" fill="#0d2b23"/><rect x="1165" y="402" width="156" height="252" rx="20" fill="#f5f7f0"/><text x="1182" y="445" font-size="23" fill="#214e43" font-weight="700">Zoro</text><rect x="1181" y="465" width="124" height="81" rx="12" fill="#315b4d"/><text x="1192" y="493" font-size="12" fill="#fff" font-weight="700">Back home</text><text x="1192" y="526" font-size="16" fill="#fff" font-weight="700">₦250,000</text><rect x="1181" y="563" width="124" height="28" rx="8" fill="#e0e8d8"/><text x="1192" y="582" font-size="11" fill="#214e43" font-weight="700">Add expense</text><text x="839" y="610" font-size="14" fill="#b6cbbf" font-weight="400">Interface illustration · fictional amounts</text></svg>