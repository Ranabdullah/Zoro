<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img"><style>text{font-family:Arial,Helvetica,sans-serif}</style><title>Transfer a wallet safely using a full backup</title><rect x="0" y="0" width="1200" height="430" rx="0" fill="#f3f6ee"/><text x="48" y="62" font-size="32" fill="#214e43" font-weight="700">Move your wallet. Keep a verified copy.</text><rect x="48" y="108" width="254" height="228" rx="22" fill="#fff"/><circle cx="89" cy="152" r="21" fill="#214e43"/><text x="83" y="160" font-size="22" fill="#fff" font-weight="700">1</text><text x="71" y="211" font-size="18" fill="#214e43" font-weight="700">BACK UP</text><text x="71" y="260" font-size="16" fill="#214e43" font-weight="400">Old wallet → Full Excel</text><text x="71" y="299" font-size="15" fill="#637a6a" font-weight="400">Includes receipt photos</text><rect x="333" y="108" width="254" height="228" rx="22" fill="#fff"/><circle cx="374" cy="152" r="21" fill="#214e43"/><text x="368" y="160" font-size="22" fill="#fff" font-weight="700">2</text><text x="356" y="211" font-size="18" fill="#214e43" font-weight="700">SIGN IN</text><text x="356" y="260" font-size="16" fill="#214e43" font-weight="400">Create destination login</text><text x="356" y="299" font-size="15" fill="#637a6a" font-weight="400">New project, new MFA</text><rect x="618" y="108" width="254" height="228" rx="22" fill="#fff"/><circle cx="659" cy="152" r="21" fill="#214e43"/><text x="653" y="160" font-size="22" fill="#fff" font-weight="700">3</text><text x="641" y="211" font-size="18" fill="#214e43" font-weight="700">RESTORE</text><text x="641" y="260" font-size="16" fill="#214e43" font-weight="400">Import the full backup</text><text x="641" y="299" font-size="15" fill="#637a6a" font-weight="400">Review before replacing</text><rect x="903" y="108" width="254" height="228" rx="22" fill="#fff"/><circle cx="944" cy="152" r="21" fill="#214e43"/><text x="938" y="160" font-size="22" fill="#fff" font-weight="700">4</text><text x="926" y="211" font-size="18" fill="#214e43" font-weight="700">VERIFY</text><text x="926" y="260" font-size="16" fill="#214e43" font-weight="400">Check PC + phone</text><text x="926" y="299" font-size="15" fill="#637a6a" font-weight="400">Then decide about old data</text><text x="48" y="384" font-size="20" fill="#637a6a" font-weight="400">Do not put wallet backups in GitHub. They contain private, unencrypted records.</text></svg>